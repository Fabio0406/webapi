
name: Java CI with Maven

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  JAVA_VERSION: "21"

jobs:
  # ------------------------------------------------------------------
  # ETAPA 1: Compilacion (sin pruebas)
  # ------------------------------------------------------------------
  build:
    name: 1. Compilacion
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v5

      - name: Configurar JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
          cache: maven

      - name: Compilar con Maven
        run: mvn -B clean package --file pom.xml -DskipTests

  # ------------------------------------------------------------------
  # ETAPA 2: Pruebas unitarias + cobertura (QUALITY GATE)
  # Solo se ejecuta si la compilacion fue exitosa.
  # ------------------------------------------------------------------
  test:
    name: 2. Pruebas unitarias y cobertura
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v5

      - name: Configurar JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
          cache: maven

      # Quality Gate 1: si alguna prueba falla, el step falla y el pipeline se detiene
      - name: Ejecutar pruebas unitarias
        run: mvn -B test --file pom.xml

      - name: Generar reporte de cobertura (JaCoCo)
        if: always()
        run: mvn -B jacoco:report --file pom.xml

      # Quality Gate 2: cobertura minima de lineas del 60% (regla definida en pom.xml)
      - name: Verificar cobertura minima (Quality Gate)
        run: mvn -B jacoco:check@quality-gate --file pom.xml

      - name: Resumen de resultados en el pipeline
        if: always()
        run: |
          echo "## Resultado de las pruebas unitarias" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          grep -h "Tests run" target/surefire-reports/*.txt >> $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Cobertura de codigo (JaCoCo)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat target/site/jacoco/jacoco.csv >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Publicar reporte de pruebas (JUnit)
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: "target/surefire-reports/TEST-*.xml"
          check_name: "Reporte de pruebas unitarias"
          fail_on_failure: true

      - name: Publicar artefacto - Reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas
          path: target/surefire-reports/
          retention-days: 7

      - name: Publicar artefacto - Reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura
          path: target/site/jacoco/
          retention-days: 7

  # ------------------------------------------------------------------
  # ETAPA 3: Empaquetado final
  # Solo se ejecuta si TODAS las pruebas pasaron (Quality Gate superado).
  # ------------------------------------------------------------------
  package:
    name: 3. Empaquetado (post Quality Gate)
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v5

      - name: Configurar JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"
          cache: maven

      - name: Empaquetar aplicacion
        run: mvn -B package --file pom.xml -DskipTests

      - name: Publicar artefacto - JAR de la aplicacion
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 7
